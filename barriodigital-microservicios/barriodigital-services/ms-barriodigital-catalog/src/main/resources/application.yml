server:
  port: 8082

spring:
  application:
    name: ms-barriodigital-catalog

  datasource:
    # Para producción: reemplazar por el driver de Oracle y la URL de la BD cloud, ej:
    # url: jdbc:oracle:thin:@//<host>:1521/<service_name>
    # driver-class-name: oracle.jdbc.OracleDriver
    #
    # Mientras tanto usamos H2 en modo compatibilidad Oracle (MODE=Oracle):
    # emula el dialecto SQL de Oracle, así el código JPA/Hibernate queda listo
    # para portar a Oracle real sin cambios. jdbc:h2:file (no :mem) para que
    # los datos persistan entre reinicios.
    url: jdbc:h2:file:./data/catalogdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
